<!-- App shell (SaberSim-style) -->
<div class="layout">
  <aside class="nav">
    <!-- Top tools -->
    <a class="nav-item" routerLink="/assets" routerLinkActive="active" aria-label="Data Assets">
      <span class="icon">📂</span>
      <span class="tooltip">Assets</span>
    </a>
    <a class="nav-item" routerLink="/optimizer" routerLinkActive="active" aria-label="Optimizer">
      <span class="icon">🧮</span>
      <span class="tooltip">Optimizer</span>
    </a>
    <a class="nav-item" routerLink="/simulations" routerLinkActive="active" aria-label="Simulations">
      <span class="icon">🎲</span>
      <span class="tooltip">Simulations</span>
    </a>
    <a class="nav-item" routerLink="/variants" routerLinkActive="active" aria-label="Variants">
      <span class="icon">🧬</span>
      <span class="tooltip">Variants</span>
    </a>
    <a class="nav-item" routerLink="/results" routerLinkActive="active" aria-label="Results">
      <span class="icon">📊</span>
      <span class="tooltip">Results</span>
    </a>

    <div class="spacer"></div>

    <!-- Bottom (global) -->
    <a class="nav-item" routerLink="/settings" routerLinkActive="active" aria-label="Settings">
      <span class="icon">⚙️</span>
      <span class="tooltip">Settings</span>
    </a>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <aside class="inspector">
    <app-inspector></app-inspector>
  </aside>
</div>
